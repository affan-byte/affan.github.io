<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengingat Tugas</title>

<!-- TATA LETAK PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B6E6E">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    --paper:#FAF7F1; --ink:#1F2430; --line:#E4DFD3;
    --teal:#1B6E6E; --teal-ink:#0E4444;
    --amber:#C7862B; --amber-bg:#FBF0DD;
    --danger:#B8433A; --danger-bg:#FBE9E6;
    --ok-bg:#EDF3EC;
    --card:#FFFFFF;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15181F; --ink:#EDEAE1; --line:#2A2E38;
      --teal:#4FBFBF; --teal-ink:#BEEAEA;
      --amber:#E3A64C; --amber-bg:#3A2E15;
      --danger:#E27C72; --danger-bg:#3A1E1B;
      --ok-bg:#1D2A22;
      --card:#1B1F28;
    }
  }
  :root[data-theme="dark"]{
    --paper:#15181F; --ink:#EDEAE1; --line:#2A2E38;
    --teal:#4FBFBF; --teal-ink:#BEEAEA;
    --amber:#E3A64C; --amber-bg:#3A2E15;
    --danger:#E27C72; --danger-bg:#3A1E1B;
    --ok-bg:#1D2A22;
    --card:#1B1F28;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto; padding:2.5rem 1.25rem 4rem;}
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:1.9rem; letter-spacing:-0.01em; margin:0 0 0.35rem;
  }
  .sub{color:color-mix(in srgb, var(--ink) 60%, transparent); margin:0 0 2rem; font-size:0.95rem; max-width:46ch;}

  .notify-bar{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    border:1px solid var(--line); border-radius:10px; padding:0.85rem 1rem;
    margin-bottom:1.75rem; background:var(--card); font-size:0.88rem;
  }
  .notify-bar span{color:color-mix(in srgb, var(--ink) 70%, transparent);}
  .notify-bar button{
    background:var(--teal); color:#fff; border:none; border-radius:7px;
    padding:0.5rem 0.9rem; font-size:0.85rem; font-weight:600; cursor:pointer;
    font-family:inherit; white-space:nowrap;
  }
  .notify-bar button:disabled{opacity:0.5; cursor:default;}

  form{
    display:grid; gap:0.75rem; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:1.25rem; margin-bottom:2rem;
  }
  .row{display:grid; grid-template-columns:1fr; gap:0.75rem;}
  @media(min-width:480px){ .row{grid-template-columns:1fr 1fr;} }
  label{font-size:0.78rem; font-weight:600; color:color-mix(in srgb, var(--ink) 65%, transparent); margin-bottom:0.3rem; display:block;}
  input[type=text], input[type=datetime-local]{
    width:100%; padding:0.6rem 0.7rem; border:1px solid var(--line); border-radius:8px;
    background:var(--paper); color:var(--ink); font-family:inherit; font-size:0.95rem;
  }
  input:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}
  form button{
    justify-self:start; background:var(--ink); color:var(--paper); border:none;
    border-radius:8px; padding:0.65rem 1.2rem; font-weight:600; font-size:0.9rem;
    cursor:pointer; font-family:inherit;
  }
  form button:hover{opacity:0.9;}

  .list{display:grid; gap:0.75rem;}
  .empty{
    text-align:left; padding:2rem 1.25rem; border:1px dashed var(--line); border-radius:12px;
    color:color-mix(in srgb, var(--ink) 55%, transparent); font-size:0.92rem;
  }
  .task{
    background:var(--card); border:1px solid var(--line); border-left-width:5px;
    border-radius:10px; padding:0.9rem 1rem; display:flex; justify-content:space-between;
    gap:1rem; align-items:center;
  }
  .task.upcoming{border-left-color:var(--line);}
  .task.soon{border-left-color:var(--amber); background:linear-gradient(0deg,var(--card),var(--card)), var(--amber-bg); background-blend-mode:normal;}
  .task.soon{background:var(--amber-bg);}
  .task.overdue{border-left-color:var(--danger); background:var(--danger-bg);}
  .task.done{border-left-color:var(--line); opacity:0.55;}
  .t-main{min-width:0;}
  .t-title{font-weight:600; font-size:1rem; margin:0 0 0.2rem; word-break:break-word;}
  .t-title.strike{text-decoration:line-through;}
  .t-meta{font-size:0.82rem; color:color-mix(in srgb, var(--ink) 60%, transparent); font-variant-numeric:tabular-nums;}
  .t-count{font-family:'Space Grotesk',monospace; font-weight:700; font-size:0.82rem;}
  .soon .t-count{color:var(--amber);}
  .overdue .t-count{color:var(--danger);}
  .t-actions{display:flex; gap:0.4rem; flex-shrink:0;}
  .t-actions button{
    border:1px solid var(--line); background:transparent; color:var(--ink);
    border-radius:7px; width:2rem; height:2rem; cursor:pointer; font-size:0.95rem;
    display:flex; align-items:center; justify-content:center; font-family:inherit;
  }
  .t-actions button:hover{background:var(--paper);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pengingat Tugas</h1>
  <p class="sub">Catat tugas dan tenggat waktunya. Kamu akan mendapat notifikasi di perangkat ini saat tenggat sudah dekat.</p>

  <div class="notify-bar">
    <span id="notifyStatus">Notifikasi belum diaktifkan.</span>
    <button id="notifyBtn">Aktifkan notifikasi</button>
  </div>

  <form id="taskForm">
    <div>
      <label for="title">Nama tugas</label>
      <input type="text" id="title" placeholder="Contoh: Laporan praktikum kimia" required maxlength="120">
    </div>
    <div class="row">
      <div>
        <label for="deadline">Tenggat waktu</label>
        <input type="datetime-local" id="deadline" required>
      </div>
      <div>
        <label for="remind">Ingatkan sebelum</label>
        <select id="remind" style="width:100%;padding:0.6rem 0.7rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:0.95rem;">
          <option value="1440">1 hari</option>
          <option value="180">3 jam</option>
          <option value="60" selected>1 jam</option>
          <option value="15">15 menit</option>
        </select>
      </div>
    </div>
    <button type="submit">Tambah tugas</button>
  </form>

  <div class="list" id="list"></div>
</div>

<script>
// Mendaftarkan Service Worker untuk fitur PWA (Offline & Installable)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('Service Worker terdaftar dengan sukses!', reg.scope))
      .catch((err) => console.error('Gagal mendaftar Service Worker', err));
  });
}

(function(){
  const STORE_KEY = 'reminder_tasks_v1';
  const form = document.getElementById('taskForm');
  const listEl = document.getElementById('list');
  const notifyBtn = document.getElementById('notifyBtn');
  const notifyStatus = document.getElementById('notifyStatus');

  // Mengatur nilai default deadline ke waktu saat ini
  function setDefaultDeadline() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('deadline').value = now.toISOString().slice(0, 16);
  }
  setDefaultDeadline();

  function load(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch(e){ return []; }
  }
  function save(tasks){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); }
    catch(e){ console.error('Gagal menyimpan', e); }
  }

  let tasks = load();

  function updateNotifyUI(){
    if(!('Notification' in window)){
      notifyStatus.textContent = 'Perangkat ini tidak mendukung notifikasi browser.';
      notifyBtn.disabled = true;
      return;
    }
    if(Notification.permission === 'granted'){
      notifyStatus.textContent = 'Notifikasi aktif untuk halaman ini.';
      notifyBtn.disabled = true;
      notifyBtn.textContent = 'Aktif';
    } else if(Notification.permission === 'denied'){
      notifyStatus.textContent = 'Izin notifikasi ditolak. Ubah lewat pengaturan browser untuk mengaktifkan.';
      notifyBtn.disabled = true;
    } else {
      notifyStatus.textContent = 'Notifikasi belum diaktifkan.';
      notifyBtn.disabled = false;
      notifyBtn.textContent = 'Aktifkan notifikasi';
    }
  }

  notifyBtn.addEventListener('click', function(){
    if(!('Notification' in window)) return;
    Notification.requestPermission().then(updateNotifyUI);
  });

  function fmtDeadline(d){
    return d.toLocaleString('id-ID', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
  }

  function timeLeftLabel(ms){
    if(ms <= 0) return 'Sudah lewat tenggat';
    const min = Math.floor(ms/60000);
    const days = Math.floor(min/1440);
    const hours = Math.floor((min%1440)/60);
    const mins = min%60;
    if(days > 0) return `${days} hari ${hours} jam lagi`;
    if(hours > 0) return `${hours} jam ${mins} menit lagi`;
    return `${mins} menit lagi`;
  }

  function render(){
    tasks.sort((a,b)=> a.done - b.done || new Date(a.deadline) - new Date(b.deadline));
    if(tasks.length === 0){
      listEl.innerHTML = '<div class="empty">Belum ada tugas. Tambahkan tugas pertamamu di atas.</div>';
      return;
    }
    const now = Date.now();
    listEl.innerHTML = tasks.map(t=>{
      const dl = new Date(t.deadline);
      const diff = dl.getTime() - now;
      let cls = 'upcoming';
      if(t.done) cls = 'done';
      else if(diff <= 0) cls = 'overdue';
      else if(diff <= t.remindMinutes*60000) cls = 'soon';
      return `<div class="task ${cls}" data-id="${t.id}">
        <div class="t-main">
          <p class="t-title ${t.done?'strike':''}">${escapeHtml(t.title)}</p>
          <p class="t-meta">${fmtDeadline(dl)} &middot; <span class="t-count">${t.done?'Selesai':timeLeftLabel(diff)}</span></p>
        </div>
        <div class="t-actions">
          <button class="doneBtn" title="${t.done?'Tandai belum selesai':'Tandai selesai'}">${t.done?'↺':'✓'}</button>
          <button class="delBtn" title="Hapus tugas">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const title = document.getElementById('title').value.trim();
    const deadline = document.getElementById('deadline').value;
    const remindMinutes = parseInt(document.getElementById('remind').value, 10);
    if(!title || !deadline) return;
    tasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      title, deadline, remindMinutes, done:false, notified:false
    });
    save(tasks);
    form.reset();
    document.getElementById('remind').value = '60';
    setDefaultDeadline(); // Reset waktu input kembali ke waktu saat ini
    render();
  });

  listEl.addEventListener('click', function(e){
    const card = e.target.closest('.task');
    if(!card) return;
    const id = card.dataset.id;
    const t = tasks.find(x=>x.id === id);
    if(!t) return;
    if(e.target.classList.contains('delBtn')){
      tasks = tasks.filter(x=>x.id !== id);
      save(tasks); render();
    } else if(e.target.classList.contains('doneBtn')){
      t.done = !t.done;
      save(tasks); render();
    }
  });

  function checkReminders(){
    const now = Date.now();
    let changed = false;
    tasks.forEach(t=>{
      if(t.done || t.notified) return;
      const diff = new Date(t.deadline).getTime() - now;
      if(diff > 0 && diff <= t.remindMinutes*60000){
        if('Notification' in window && Notification.permission === 'granted'){
          new Notification('Tenggat tugas sudah dekat', {
            body: `${t.title} — ${timeLeftLabel(diff)}`,
            icon: 'icon-192.png' // Menambahkan ikon PWA di notifikasi
          });
        }
        t.notified = true;
        changed = true;
      }
    });
    if(changed) save(tasks);
    render();
  }

  updateNotifyUI();
  render();
  checkReminders();
  setInterval(checkReminders, 30000);
})();
</script>
</body>
</html>
